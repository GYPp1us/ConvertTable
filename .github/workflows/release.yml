name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (must already exist, e.g. v1.5.1)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Resolve version
        id: meta
        run: |
          set -euo pipefail
          VERSION=$(grep -E '^version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved version=$VERSION tag=$TAG"

      - name: Verify tag matches gradle.properties
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          TAG="${{ steps.meta.outputs.tag }}"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag '$TAG' does not match gradle.properties version 'v$VERSION'."
            echo "Bump version in gradle.properties, or retag as v$VERSION."
            exit 1
          fi

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --stacktrace --no-daemon

      - name: Locate and verify jars
        id: jars
        run: |
          set -euo pipefail
          MOD_JAR=$(ls build/libs/convert-table-*.jar | grep -v -- '-sources.jar' | head -n1)
          SRC_JAR=$(ls build/libs/convert-table-*-sources.jar | head -n1)
          test -f "$MOD_JAR" || { echo "::error::Missing mod jar"; exit 1; }
          test -f "$SRC_JAR" || { echo "::error::Missing sources jar"; exit 1; }
          unzip -p "$MOD_JAR" fabric.mod.json | grep -q '"id": "convert_table"' \
            || { echo "::error::Mod jar metadata is wrong"; exit 1; }
          # Stable-named copy so /releases/latest/download/convert-table.jar always resolves.
          cp "$MOD_JAR" convert-table.jar
          echo "mod_jar=$MOD_JAR" >> "$GITHUB_OUTPUT"
          echo "src_jar=$SRC_JAR" >> "$GITHUB_OUTPUT"
          sha256sum "$MOD_JAR" "$SRC_JAR" | tee SHA256SUMS.txt

      - name: Compose release notes
        id: notes
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          cat > NOTES.md <<'EOF'
          ## ConvertTable ${{ steps.meta.outputs.version }}

          Automated release built from `${{ github.sha }}` with Java 25.

          ### Install
          1. Download `convert-table-${{ steps.meta.outputs.version }}.jar` below.
          2. Put it in your instance's `mods` folder together with [Fabric API](https://modrinth.com/mod/fabric-api).
          3. Install on **both client and server** for multiplayer. Do not install the `-sources` jar.

          ### Requirements
          | Component | Version |
          | --- | --- |
          | Minecraft | 26.3 |
          | Fabric Loader | 0.19.5+ |
          | Fabric API | 0.161.0+26.3 |
          | Java | 25 |

          ### Artifacts
          - `convert-table.jar` — stable-named copy, always the newest build
          - `convert-table-${{ steps.meta.outputs.version }}.jar` — install this one
          - `convert-table-${{ steps.meta.outputs.version }}-sources.jar` — development only
          - `SHA256SUMS.txt` — checksums
          EOF
          {
            echo ""
            echo "### Checksums"
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
          } >> NOTES.md
          echo "Release notes written."

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          gh release create "$TAG" \
            --title "ConvertTable ${{ steps.meta.outputs.version }}" \
            --notes-file NOTES.md \
            --verify-tag \
            "${{ steps.jars.outputs.mod_jar }}#${{ steps.jars.outputs.mod_jar }}" \
            "${{ steps.jars.outputs.src_jar }}#${{ steps.jars.outputs.src_jar }}" \
            convert-table.jar \
            SHA256SUMS.txt
