name: Build

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (Java 25)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --stacktrace --no-daemon

      - name: Collect artifacts
        id: collect
        run: |
          set -euo pipefail
          echo "Built files:"
          ls -l build/libs
          MOD_JAR=$(ls build/libs/convert-table-*.jar | grep -v -- '-sources.jar' | head -n1)
          test -n "$MOD_JAR" || { echo "::error::No mod jar produced"; exit 1; }
          echo "mod_jar=$MOD_JAR" >> "$GITHUB_OUTPUT"
          echo "version=$(grep -E '^version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Package check
        run: |
          set -euo pipefail
          JAR="${{ steps.collect.outputs.mod_jar }}"
          echo "Inspecting $JAR"
          unzip -l "$JAR" | grep -E 'fabric.mod.json|convert_table.mixins.json' \
            || { echo "::error::Jar is missing required metadata"; exit 1; }
          unzip -p "$JAR" fabric.mod.json

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: convert-table-${{ steps.collect.outputs.version }}
          path: |
            build/libs/convert-table-*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 30

      - name: Upload sources jar
        uses: actions/upload-artifact@v4
        with:
          name: convert-table-${{ steps.collect.outputs.version }}-sources
          path: build/libs/*-sources.jar
          if-no-files-found: warn
          retention-days: 30

      - name: Build summary
        if: always()
        run: |
          {
            echo "## Build result"
            echo ""
            echo "- Version: \`${{ steps.collect.outputs.version }}\`"
            echo "- Mod jar: \`${{ steps.collect.outputs.mod_jar }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
