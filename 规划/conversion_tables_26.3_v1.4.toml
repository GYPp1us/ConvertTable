# Canonical ordinary/advanced recipe source. Exported to runtime JSON by sync_recipes.py.
# The mod loads the exported JSON, not this TOML. ui/network/rules draft metadata is not executable.
# Conversion operation durations are code constants, not editable recipe settings: piglin 4 s, end 2 s, sculk 1 s.
# Soul costs: spawn-egg life shaping x4, item conversions (including fish revival) x3 relative to v0.2.0.
# Conversion Table data; compact canonical source for coding/LLM edits.
# Item format in arrays/recipe fields: "minecraft_id|中文名".
# group.tier: piglin => Piglin+End+Sculk; end => End+Sculk; sculk => Sculk only.
# CRITICAL: every group.items is one strict 1:1 all-to-all equivalence class.

[meta]
mc = "26.3"
version = "0.3.2"
schema = 2

[piglin]
mode = "random"
cost = "gold_nugget|金粒"
cost_n = 1
per_batch = true
exclude_same = true

[end]
mode = "select"
fuel = "chorus_fruit|紫颂果"
fuel_charge = 16
charge_per_batch = 1
container_radius = 16
max_containers = 8

[sculk]
mode = "select+advanced"
inherits_end = true
# Sculk ordinary and advanced conversions do not consume phase fuel.
advanced_charge_per_operation = 0
# Ordinary sculk conversions spend this many available souls per successful batch.
ordinary_souls_per_batch = 3
advanced_cost = "death_count"
death_cost_balance = "life_x4_conversion_x3_from_v0.2.0"
# Legacy field retained and validated for compatibility; runtime ignores it. Available souls use each eligible mob's XP reward times the fixed code multiplier 32 (1 XP = 32 souls).
death_count_per_mob = 1
death_count_capacity = 4096
death_surface = "minecraft:sculk"
requires_connected_surface = true
requires_player_kill = false
consume_player_xp = false
intercept_xp_orbs = false
cancel_vanilla_death_effects = false

[sculk.network]
status = "draft"
connectivity = "face_adjacent_with_actual_vein_face_paths"
max_manhattan_distance = 16
max_nodes = 1024
loaded_chunks_only = true
nodes = ["minecraft:sculk", "minecraft:sculk_vein", "minecraft:sculk_catalyst", "minecraft:sculk_sensor", "minecraft:calibrated_sculk_sensor", "minecraft:sculk_shrieker"]
shared_death_owner = "nearest_table_by_network_path_then_coordinates"
unknown_region = "show_incomplete_not_disconnected"

[sculk.counting]
status = "draft"
eligible = "mob_death_supported_on_connected_sculk_top"
exclude = ["minecraft:player", "minecraft:armor_stand", "non_living_entity"]
unique_death_event = true
store = "table_block_entity"
refund_uncommitted = true
retain_when_surface_disconnects = true

[ui]
status = "draft"
input_modes = ["slot", "linked_containers", "container_contents"]
ordinary_match_modes = ["exact_item", "same_group"]
default_match_mode = "exact_item"
skip_target_item = true
preview_before_start = true
target_selection = ["search", "current_group", "favorites", "recent"]
container_roles = ["input", "output"]
container_display = "input_output_counts"
linked_container_limit_counts_both_roles = true
contents_mode_requires_explicit_selection = true
piglin_target_selector = false
piglin_progress_bar = true
sculk_projection_axis = "Y"
sculk_projection_plane = "XZ"
sculk_projection_style = "minimal_2d_grid"
sculk_projection = ["connected_nodes", "eligible_ground", "ownership", "disconnected", "unknown"]
advanced_auto_false = "manual_single_operation_only"

[rules]
preserve = ["sign_text_front/back", "banner_patterns", "container_contents", "custom_name", "copper_golem_pose"]
exclude = ["ores", "mineral_blocks", "ingots", "gems", "equipment", "spawners", "vaults", "trial_spawners", "end_portal_frame", "reinforced_deepslate"]

